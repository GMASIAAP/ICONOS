  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #ff6c0e 0%, #d9560a 100%);
      padding: 24px;
    }
    .caja {
      background: #fff;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px -12px rgba(0,0,0,.35);
    }
    .caja img.logo { width: 200px; max-width: 80%; margin-bottom: 18px; }
    h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 27px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #b34406;
      margin-bottom: 8px;
    }
    p { font-size: 14px; color: #8a7d72; line-height: 1.6; margin-bottom: 22px; }
    .boton {
      display: inline-block;
      background: #ff6c0e;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 34px;
      border-radius: 999px;
      box-shadow: 0 8px 20px -6px rgba(255,108,14,.6);
    }
    .boton:active { background: #d9560a; }
    .pista {
      margin-top: 22px;
      font-size: 12.5px;
      color: #8a7d72;
      background: #fff1e6;
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
